logging:
  pattern:
    console: "[%-15.15thread] %-5level %-40.40logger{39} : %m%n%wEx"
  level:
    root: info
    com.lego.yxl: info
    org.springframework.web: info
    org.springframework.data.rest: info
    net.ttddyy.dsproxy.listener: info

server:
  port: 8080

spring:
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://127.0.0.1:3306/lego
    username: root
    password: 123456
  data:
    redis:
      host: 127.0.0.1
      port: 6379