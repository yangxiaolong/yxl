logging:
  pattern:
    console: "[%thread] %-5level %-40.40logger{39} : %m%n%wEx"
  level:
    root: info
    com.lego.yxl: info
    org.springframework.web: info
    org.springframework.data.rest: info
    net.ttddyy.dsproxy.listener: info

server:
  port: 8080

rocketmq:
  name-server: http://127.0.0.1:9876
  producer:
    group: async-demo

async:
  test:
    normal:
      topic: normal-async-test-topic
      group1: normal-async-test-group1
      group2: normal-async-test-group2
    order:
      topic: order-async-test-topic
      group1: order-async-test-group1
      group2: order-async-test-group2